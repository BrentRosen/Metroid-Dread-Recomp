name: Feature request
description: An idea for a setting, option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What it should do, and the problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Your hardware if it matters (screen size, refresh rate, controller), or how another version does it.
